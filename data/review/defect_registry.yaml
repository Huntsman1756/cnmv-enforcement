schema_version: 1
defect_classes:
- id: PHANTOM_RESPONDENT
  description: 'Textual splitting created respondents that do not exist in the source
    (paren text, dative clauses inside descriptive sentences).

    '
- id: RESPONDENT_MERGE_LOSS
  description: 'A genuine ''X y Y'' subject list was kept as one merged respondent
    — under-counted respondents and merged identity.

    '
- id: ENTITY_NAME_SPLIT_ERROR
  description: 'A corporate name containing ''y''/''de'' was split into phantom respondents
    — fan-out of the same sanction onto fragments.

    '
- id: SUBJECT_TEXT_CONTAMINATION
  description: 'Sanction or boilerplate text leaked into respondent names (''separación
    del cargo con…'', '', por la comisión'').

    '
- id: RESPECTIVAMENTE_ALIGNMENT_ERROR
  description: '''respectivamente'' wording produced a subject × sanction cross-product
    instead of positional pairing.

    '
- id: COMISION_VARIANT_DROP
  description: 'A ''por la comisión de…'' wording variant was not recognised, producing
    untyped/zero blocks or lost infringements.

    '
- id: STATUTE_MISATTRIBUTION
  description: 'A provision was attributed to the wrong legal instrument (same-text-legal
    leakage, successor-law pollution, connector loss).

    '
- id: ARTICLE_SUFFIX_LOSS
  description: 'Article sub-letters/word suffixes/apartados were dropped — wrong provision
    identity (''99, letra o)'' → 99).

    '
- id: CONDUCT_DATE_LOSS
  description: 'Conduct-period expressions were dropped or collapsed (cross-month
    lists, ''y el'' forms) — fabricated or missing windows.

    '
- id: RESOLUTION_DATE_LOSS
  description: 'The sanctioning-resolution date was not extracted for the dominant
    official wording.

    '
- id: DURATION_FIELD_LOSS
  description: 'Parsed disqualification/suspension durations were dropped between
    parse and assembly — became NULL in the dataset.

    '
- id: DUPLICATE_KEY_CORRUPTION
  description: 'The same respondent appeared as duplicate primary-key rows — broken
    referential integrity.

    '
- id: SUCCESSOR_LIABILITY_PATTERN
  description: Sanctions imposed on a successor entity while the infringement was
    declared on a dissolved predecessor — 'Declarar la responsabilidad de X' + 'Imponer
    a Y, como sucesor en la responsabilidad declarada de X' (incl. colon-list and
    dash-amount forms and the 'Declarar que X ha incurrido en la comisión' variant).
- id: LETTERED_CONDUCT_ITEMS
  description: Lettered ('a)') or dashed/bulleted ('•', '–') conduct items under an
    open block were flagged unhandled or silently skipped instead of contributing
    conduct detail and dates.
- id: QUOTED_ENTITY_WRAPPERS
  description: Older BOE wraps entity names in curly quotes ('‘‘X’’') or guillemets
    ('«X»'); the quotes contaminated subject identity and the ' y '/'，' inside quoted
    names broke splitting.
- id: NUMBERED_OPERATIVE_ITEMS
  description: 2010-era dispositivos enumerate sanction clauses as '1. Imponer a…',
    '2. A X…' — the numeric prefix defeated the Imponer/A-subject anchors.
- id: SANCTION_BEFORE_COMISION
  description: '''Imponer a X una multa, por la comisión de…'' — the sanction clause
    precedes ''por la comisión''; the amount sits in the trailing ''por un importe
    de … (N euros)''.'
- id: ORGAN_MEMBERS_ENUMERATION
  description: '''los miembros del Consejo de Administración de X: don A, don B…''
    — the organ-member role header became a phantom subject and fused with the first
    member.'
