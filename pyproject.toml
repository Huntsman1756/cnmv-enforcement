[project]
name = "cnmv-enforcement"
version = "0.1.0"
description = "An evidence-backed historical ledger of publicly observable CNMV enforcement, reconstructed from the CNMV public sanctions register, BOE publications and subsequent official documents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "cnmv-enforcement contributors" }]
keywords = ["cnmv", "enforcement", "spain", "sanctions", "boe", "open-data"]

dependencies = [
    "pydantic>=2.9",
    "httpx>=0.28",
    "lxml>=5.3",
    "selectolax>=0.3.27",
    "duckdb>=1.2",
    "pyarrow>=18",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "orjson>=3.10",
    "pyyaml>=6.0.2",
    "platformdirs>=4.3",
    "pypdf>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "hypothesis>=6.119",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
cnmv-enforcement = "cnmv_enforcement.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnmv_enforcement"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF", "C4", "ISC", "PIE", "PL", "TRY", "DTZ", "N"]
ignore = [
    "TRY003",   # long exception messages are fine in this codebase
    "PLR2004",  # magic values in comparisons are often clearer in parsers
    "PLR0912",  # parser branches legitimately exceed default branch counts
    "PLR0913",  # domain constructors have many fields
    "PLR0915",  # parser functions legitimately have many statements
    "DTZ007",   # strptime without tz is correct for legal dates
]
[tool.ruff.lint.per-file-ignores]
# The parser deliberately matches Unicode bullet/dash/nbsp variants —
# the ambiguity IS the point (BOE text uses all of them).
"src/cnmv_enforcement/parsing/**" = ["RUF001", "RUF002", "RUF003"]
"src/cnmv_enforcement/sources/**" = ["RUF001", "RUF002", "RUF003"]
"src/cnmv_enforcement/cli/**" = ["PLC0415", "ISC004"]
"src/cnmv_enforcement/coverage/**" = ["ISC004"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["cnmv_enforcement"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "live: tests that hit live official sources (never run in default CI)",
    "golden: golden-file tests",
    "slow: slow tests",
]

[tool.coverage.run]
source = ["src/cnmv_enforcement"]
