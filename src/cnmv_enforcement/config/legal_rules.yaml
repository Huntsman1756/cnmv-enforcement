# Temporal legal-rule index for CNMV enforcement typifications.
#
# Every entry describes a *versioned* provision: the same article number may
# exist in several instruments or change text over time. Resolution is
# deterministic: (instrument family, article, conduct window) → rule_id.
#
# valid_from/valid_to are entry-into-force boundaries of the instrument's
# sanctioning typification (approximated at instrument level; article-level
# amendments are only modeled where observed in parsed text).
# conduct_code is a curated category; UNKNOWN is an honest answer.

