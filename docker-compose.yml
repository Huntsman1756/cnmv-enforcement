services:
  api:
    build: .
    ports:
      - "8765:8765"
    environment:
      - CNMV_ENFORCEMENT_DATA=/app/data
    volumes:
      - ./data:/app/data
    read_only: false

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
